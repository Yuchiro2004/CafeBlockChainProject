<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loyalty Point DApp</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --accent:#6ee7b7; --accent2:#f59e0b;
    --text:#e5e7eb; --muted:#9ca3af; --danger:#f87171; --border:#2a2e37;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 24px; border-bottom:1px solid var(--border);
  }
  header h1{font-size:18px; margin:0; font-weight:600;}
  header h1 span{color:var(--accent);}
  .btn{
    padding:10px 18px; border-radius:8px; border:none; font-size:14px;
    font-weight:600; cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{opacity:.85}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn-primary{background:var(--accent); color:#052e1c;}
  .btn-danger{background:var(--danger); color:#3b0a0a;}
  .btn-outline{background:transparent; color:var(--text); border:1px solid var(--border);}
  main{max-width:560px; margin:40px auto; padding:0 20px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:24px; margin-bottom:20px;
  }
  .card h2{margin-top:0; font-size:16px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;
  }
  .badge.active{background:#064e3b; color:var(--accent);}
  .badge.paused{background:#450a0a; color:var(--danger);}
  .balance{font-size:42px; font-weight:800; margin:8px 0;}
  .balance small{font-size:16px; color:var(--muted); font-weight:500;}
  input{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background:#0f1115; color:var(--text); font-size:14px; margin-bottom:10px;
  }
  label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px;}
  .row{display:flex; gap:10px; align-items:center;}
  .status{font-size:13px; margin-top:10px; padding:8px 10px; border-radius:8px;}
  .status.ok{background:#064e3b; color:var(--accent);}
  .status.err{background:#450a0a; color:var(--danger);}
  .status.pending{background:#1f2937; color:var(--muted);}
  .reward{
    background:linear-gradient(135deg,#78350f,#f59e0b); color:#1a1200; padding:16px;
    border-radius:12px; font-weight:700; margin-top:14px; text-align:center;
  }
  .center{text-align:center; padding:60px 20px; color:var(--muted);}
  .addr{font-family:monospace; font-size:13px; color:var(--muted);}
</style>
</head>
<body x-data="loyaltyApp()" x-init="init()">

  <header>
    <h1>Loyalty<span>Point</span></h1>
    <template x-if="!connected">
      <div class="row">
        <button class="btn btn-primary" @click="connect()">Connect Wallet</button>
        <template x-if="!hasInjectedWallet">
          <button class="btn btn-outline" @click="startDemo()">Preview Demo</button>
        </template>
      </div>
    </template>
    <template x-if="connected">
      <div class="row">
        <span class="addr" x-text="shortAddr(account)"></span>
        <button class="btn btn-outline" @click="disconnect()">Logout</button>
      </div>
    </template>
  </header>

  <main>

    <template x-if="!connected">
      <div class="center">
        <p x-show="!globalError">Connect your wallet to continue.</p>
        <div class="status err" x-show="globalError" x-text="globalError" style="max-width:420px;margin:0 auto;text-align:left;"></div>
        <template x-if="!hasInjectedWallet">
          <div class="status pending" style="max-width:420px;margin:12px auto 0;text-align:left;">
            Preview demo mode uses a “read-only” placeholder account so the screen still renders in the editor.
          </div>
        </template>
      </div>
    </template>

    <template x-if="connected">
      <div>
        <div class="card">
          <h2>Contract Status</h2>
          <span class="badge" :class="paused ? 'paused' : 'active'" x-text="paused ? 'PAUSED' : 'ACTIVE'"></span>
        </div>

        <!-- ===== OWNER VIEW ===== -->
        <template x-if="isOwner">
          <div>
            <div class="card">
              <h2>Give Loyalty Points (Mint)</h2>
              <label>Customer address</label>
              <input type="text" x-model="mintTo" placeholder="0x...">
              <label>Amount</label>
              <input type="number" x-model="mintAmount" min="1" placeholder="e.g. 10">
              <button class="btn btn-primary" :disabled="minting" @click="mintPoints()">
                <span x-text="minting ? 'Sending...' : 'Give Points'"></span>
              </button>
              <div class="status" :class="mintStatus.type" x-show="mintStatus.msg" x-text="mintStatus.msg"></div>
            </div>

            <div class="card">
              <h2>Contract Control</h2>
              <button class="btn" :class="paused ? 'btn-primary' : 'btn-danger'"
                      :disabled="pausing" @click="togglePause()">
                <span x-text="pausing ? 'Processing...' : (paused ? 'Unpause Contract' : 'Pause Contract')"></span>
              </button>
              <div class="status" :class="pauseStatus.type" x-show="pauseStatus.msg" x-text="pauseStatus.msg"></div>
            </div>
          </div>
        </template>

        <!-- ===== CUSTOMER VIEW ===== -->
        <template x-if="!isOwner">
          <div>
            <div class="card">
              <h2>Your Balance</h2>
              <div class="balance"><span x-text="balance"></span> <small>points</small></div>
            </div>

            <div class="card">
              <h2>Redeem Points</h2>
              <label>Amount to redeem</label>
              <input type="number" x-model="redeemAmount" min="1" :max="balance" placeholder="e.g. 5">
              <button class="btn btn-primary" :disabled="redeeming || paused" @click="redeemPoints()">
                <span x-text="redeeming ? 'Redeeming...' : 'Redeem'"></span>
              </button>
              <div class="status" :class="redeemStatus.type" x-show="redeemStatus.msg" x-text="redeemStatus.msg"></div>

              <template x-if="showReward">
                <div class="reward">🎉 Reward unlocked! Show this screen to the shop to claim it.</div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

  </main>

<script>
// ----------------------------------------------------------------------
// CONFIG — update these if your deployed contract's address/ABI differ
// ----------------------------------------------------------------------
const CONTRACT_ADDRESS = "0xA52bd32fdF1B6A8850a9F1D57b6D9C73F935Ea69";
const CONTRACT_ABI = [
  "function owner() view returns (address)",
  "function paused() view returns (bool)",
  "function balanceOf(address account) view returns (uint256)",
  "function decimals() view returns (uint8)",
  "function symbol() view returns (string)",
  "function mint(address to, uint256 amount)",
  "function redeem(uint256 amount)",
  "function pause()",
  "function unpause()",
  "event PointsGiven(address indexed to, uint256 amount)",
  "event PointsRedeemed(address indexed customer, uint256 amount)",
  "event Transfer(address indexed from, address indexed to, uint256 value)"
];
// Redeeming this many points or more shows a "reward unlocked" banner (UI-only, no on-chain logic)
const REWARD_THRESHOLD = 5;

const iface = new ethers.Interface(CONTRACT_ABI);

function loyaltyApp() {
  return {
    connected: false,
    account: null,
    isOwner: false,
    paused: false,
    balance: "0",
    mintTo: "",
    mintAmount: "",
    redeemAmount: "",
    minting: false,
    pausing: false,
    redeeming: false,
    showReward: false,
    mintStatus: { type: "", msg: "" },
    pauseStatus: { type: "", msg: "" },
    redeemStatus: { type: "", msg: "" },
    globalError: "",
    hasInjectedWallet: false,
    demoMode: false,

    async init() {
      this.hasInjectedWallet = Boolean(window.ethereum);
      if (!window.ethereum) {
        this.globalError = "No wallet detected. Open this page in a real browser (Chrome/Edge/Firefox/Brave) with the MetaMask extension installed — it will not work inside VS Code's Live Preview or any embedded webview.";
        return;
      }
      // Reconnect silently if already authorized, and react to account/chain changes without refresh
      window.ethereum.on("accountsChanged", () => this.connect());
      window.ethereum.on("chainChanged", () => window.location.reload());

      const accounts = await window.ethereum.request({ method: "eth_accounts" });
      if (accounts.length > 0) await this.connect();
    },

    async connect() {
      this.globalError = "";
      if (!window.ethereum) {
        this.globalError = "No wallet detected. Open this page in a real browser (Chrome/Edge/Firefox/Brave) with the MetaMask extension installed — it will not work inside VS Code's Live Preview or any embedded webview.";
        return this.startDemo();
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        if (!accounts.length) return this.disconnect();

        this.account = accounts[0];
        this.connected = true;
        this.demoMode = false;

        await this.loadState();
      } catch (err) {
        console.error(err);
        this.globalError = err?.message || "Failed to connect wallet. Check the browser console for details.";
        this.disconnect();
      }
    },

    startDemo() {
      this.connected = true;
      this.demoMode = true;
      this.account = "0x0000000000000000000000000000000000000000";
      this.isOwner = false;
      this.paused = false;
      this.balance = "0";
      this.globalError = "";
    },

    disconnect() {
      this.connected = false;
      this.account = null;
      this.isOwner = false;
      this.balance = "0";
      this.demoMode = false;
    },

    // ---- Raw JSON-RPC helpers (bypass ethers Provider/Contract/Signer classes) ----
    async ethCall(fnName, args = []) {
      const data = iface.encodeFunctionData(fnName, args);
      const result = await window.ethereum.request({
        method: "eth_call",
        params: [{ to: CONTRACT_ADDRESS, data }, "latest"]
      });
      return iface.decodeFunctionResult(fnName, result);
    },

    async sendTx(fnName, args = []) {
      const data = iface.encodeFunctionData(fnName, args);
      const txHash = await window.ethereum.request({
        method: "eth_sendTransaction",
        params: [{ from: this.account, to: CONTRACT_ADDRESS, data }]
      });
      return this.waitForReceipt(txHash);
    },

    async waitForReceipt(txHash) {
      for (;;) {
        const receipt = await window.ethereum.request({
          method: "eth_getTransactionReceipt",
          params: [txHash]
        });
        if (receipt) {
          if (receipt.status === "0x0") throw new Error("Transaction reverted.");
          return receipt;
        }
        await new Promise((r) => setTimeout(r, 1500));
      }
    },

    async loadState() {
      const [ownerResult, pausedResult] = await Promise.all([
        this.ethCall("owner"),
        this.ethCall("paused")
      ]);
      this.isOwner = ownerResult[0].toLowerCase() === this.account.toLowerCase();
      this.paused = pausedResult[0];

      if (!this.isOwner) {
        const balResult = await this.ethCall("balanceOf", [this.account]);
        this.balance = balResult[0].toString();
      }
    },

    async mintPoints() {
      this.mintStatus = { type: "pending", msg: "" };
      this.minting = true;
      try {
        this.mintStatus = { type: "pending", msg: "Transaction sent, waiting for confirmation..." };
        await this.sendTx("mint", [this.mintTo, this.mintAmount]);
        this.mintStatus = { type: "ok", msg: `Gave ${this.mintAmount} points to ${this.shortAddr(this.mintTo)}` };
        this.mintTo = "";
        this.mintAmount = "";
      } catch (err) {
        this.mintStatus = { type: "err", msg: this.parseError(err) };
      } finally {
        this.minting = false;
      }
    },

    async togglePause() {
      this.pauseStatus = { type: "pending", msg: "" };
      this.pausing = true;
      try {
        await this.sendTx(this.paused ? "unpause" : "pause");
        this.paused = !this.paused;
        this.pauseStatus = { type: "ok", msg: this.paused ? "Contract paused." : "Contract unpaused." };
      } catch (err) {
        this.pauseStatus = { type: "err", msg: this.parseError(err) };
      } finally {
        this.pausing = false;
      }
    },

    async redeemPoints() {
      this.redeemStatus = { type: "pending", msg: "" };
      this.showReward = false;
      this.redeeming = true;
      try {
        const amount = this.redeemAmount;
        this.redeemStatus = { type: "pending", msg: "Transaction sent, waiting for confirmation..." };
        await this.sendTx("redeem", [amount]);
        const balResult = await this.ethCall("balanceOf", [this.account]);
        this.balance = balResult[0].toString();
        this.redeemStatus = { type: "ok", msg: `Redeemed ${amount} points.` };
        if (Number(amount) >= REWARD_THRESHOLD) this.showReward = true;
        this.redeemAmount = "";
      } catch (err) {
        this.redeemStatus = { type: "err", msg: this.parseError(err) };
      } finally {
        this.redeeming = false;
      }
    },

    shortAddr(a) {
      if (!a) return "";
      return a.slice(0, 6) + "..." + a.slice(-4);
    },

    parseError(err) {
      return err?.shortMessage || err?.reason || err?.message || "Transaction failed.";
    }
  };
}
</script>
</body>
</html>
