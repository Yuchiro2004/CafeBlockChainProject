<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loyalty Point DApp</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="script.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body x-data="loyaltyApp()" x-init="init()">

  <header>
    <h1>Loyalty<span>Point</span></h1>
    <template x-if="!connected">
      <div class="row">
        <button class="btn btn-primary" @click="connect()">Connect Wallet</button>
        <template x-if="!hasInjectedWallet">
          <button class="btn btn-outline" @click="startDemo()">Preview Demo</button>
        </template>
      </div>
    </template>
    <template x-if="connected">
      <div class="row">
        <span class="addr" x-text="shortAddr(account)"></span>
        <button class="btn btn-outline" @click="disconnect()">Logout</button>
      </div>
    </template>
  </header>

  <main>

    <template x-if="!connected">
      <div class="center">
        <p x-show="!globalError">Connect your wallet to continue.</p>
        <div class="status err" x-show="globalError" x-text="globalError" style="max-width:420px;margin:0 auto;text-align:left;"></div>
        <template x-if="!hasInjectedWallet">
          <div class="status pending" style="max-width:420px;margin:12px auto 0;text-align:left;">
            Preview demo mode uses a “read-only” placeholder account so the screen still renders in the editor.
          </div>
        </template>
      </div>
    </template>

    <template x-if="connected">
      <div>
        <div class="card">
          <h2>Contract Status</h2>
          <span class="badge" :class="paused ? 'paused' : 'active'" x-text="paused ? 'PAUSED' : 'ACTIVE'"></span>
        </div>

        <!-- ===== OWNER VIEW ===== -->
        <template x-if="isOwner">
          <div>
            <div class="card">
              <h2>Give Loyalty Points (Mint)</h2>
              <label>Customer address</label>
              <input type="text" x-model="mintTo" placeholder="0x...">
              <label>Amount</label>
              <input type="number" x-model="mintAmount" min="1" placeholder="e.g. 10">
              <button class="btn btn-primary" :disabled="minting" @click="mintPoints()">
                <span x-text="minting ? 'Sending...' : 'Give Points'"></span>
              </button>
              <div class="status" :class="mintStatus.type" x-show="mintStatus.msg" x-text="mintStatus.msg"></div>
            </div>

            <div class="card">
              <h2>Contract Control</h2>
              <button class="btn" :class="paused ? 'btn-primary' : 'btn-danger'"
                      :disabled="pausing" @click="togglePause()">
                <span x-text="pausing ? 'Processing...' : (paused ? 'Unpause Contract' : 'Pause Contract')"></span>
              </button>
              <div class="status" :class="pauseStatus.type" x-show="pauseStatus.msg" x-text="pauseStatus.msg"></div>
            </div>
          </div>
        </template>

        <!-- ===== CUSTOMER VIEW ===== -->
        <template x-if="!isOwner">
          <div>
            <div class="card">
              <h2>Your Balance</h2>
              <div class="balance"><span x-text="balance"></span> <small>points</small></div>
            </div>

            <div class="card">
              <h2>Redeem Points</h2>
              <label>Amount to redeem</label>
              <input type="number" x-model="redeemAmount" min="1" :max="balance" placeholder="e.g. 5">
              <button class="btn btn-primary" :disabled="redeeming || paused" @click="redeemPoints()">
                <span x-text="redeeming ? 'Redeeming...' : 'Redeem'"></span>
              </button>
              <div class="status" :class="redeemStatus.type" x-show="redeemStatus.msg" x-text="redeemStatus.msg"></div>

              <template x-if="showReward">
                <div class="reward">🎉 Reward unlocked! Show this screen to the shop to claim it.</div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

  </main>


</body>
</html>
